plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.preference:preference:1.2.1"   // PocketDisplay uses lorie's Prefs
        implementation "com.google.android.material:material:1.14.0"
        // Empty artifact: stops guava's ListenableFuture from being on the classpath twice.
        implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"

        implementation project(":termux-shared")
        implementation project(":lorie")   // Termux:X11 display + X server, built in
    }

    defaultConfig {
        applicationId "ch.pocketl"   // must stay 10 characters, like com.termux (see Relocator)
        minSdkVersion 24   // Termux:X11 needs Android 7+
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 127
        versionName "0.127.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)
        // Release builds (CI) pass the release tag, e.g. v1.2.3 -> 1.2.3 / 1002003.
        def ciVersion = System.getenv("POCKET_VERSION") ?: ""
        if (ciVersion) {
            versionName = ciVersion.replaceFirst('^v', '')
            validateVersionName(versionName)
            def (maj, min, pat) = versionName.tokenize('-+')[0].tokenize('.').collect { it.toInteger() }
            versionCode = maj * 1000000 + min * 1000 + pat
        }

        // Pre-installed system for the first start (see TermuxInstaller). Release CI pins its own
        // copy, every other build uses the weekly one (.github/workflows/system-image.yml).
        def systemUrl = System.getenv("POCKET_SYSTEM_URL") ?:
            "https://github.com/PianoNic/PocketLinux/releases/download/system/pocket-linux-system-aarch64.zip"
        buildConfigField "String", "POCKET_SYSTEM_URL", "\"" + systemUrl + "\""
        buildConfigField "String", "POCKET_SYSTEM_SHA256", "\"" + (System.getenv("POCKET_SYSTEM_SHA256") ?: "") + "\""
        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "ch.pocketl"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Release key: from the environment (GitHub Actions secrets) or from a local
    // keystore.properties (never committed). Without one, release builds use the test key.
    def releaseKey = [
        file: System.getenv("POCKET_KEYSTORE"), storePassword: System.getenv("POCKET_KEYSTORE_PASSWORD"),
        alias: System.getenv("POCKET_KEY_ALIAS"), keyPassword: System.getenv("POCKET_KEY_PASSWORD")]
    def localKeyProps = rootProject.file("keystore.properties")
    if (!releaseKey.file && localKeyProps.exists()) {
        def p = new Properties(); localKeyProps.withInputStream { p.load(it) }
        releaseKey = [file: p.storeFile, storePassword: p.storePassword, alias: p.keyAlias, keyPassword: p.keyPassword]
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
        release {
            if (releaseKey.file) {
                storeFile file(releaseKey.file)
                storePassword releaseKey.storePassword
                keyAlias releaseKey.alias
                keyPassword releaseKey.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // No shrinking: the X server is started through app_process by class name,
            // and the Termux/Termux:X11 code uses reflection in several places.
            minifyEnabled false
            shrinkResources false
            signingConfig releaseKey.file ? signingConfigs.release : signingConfigs.debug
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    lint {
        disable 'ProtectedPermissions'
        // Release lint trips over the Kotlin metadata of the bundled Termux:X11 library.
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false   // X server loads libXlorie.so straight from the APK
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("pocket-linux_debug_" + (abi ? abi : "arm64-v8a") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("pocket-linux_release_" + (abi ? abi : "arm64-v8a") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}
