<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Pocket Linux: a jeans pocket whose top hem is a window title bar (with the three
       window buttons). 108x108 = Android adaptive icon canvas; everything stays inside
       the 66-unit safe circle around (54,54). Two flat colors, no gradient. -->
  <rect width="108" height="108" fill="#101418"/>
  <!-- title bar / pocket hem, with three window-control dots cut out -->
  <path fill="#F4B63F" fill-rule="evenodd" d="M33 31h42a4 4 0 0 1 4 4v5H29v-5a4 4 0 0 1 4-4z
    M73.5 35.5m-2.2 0a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0z
    M66.5 35.5m-2.2 0a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0z
    M59.5 35.5m-2.2 0a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0z"/>
  <!-- pocket body, pointed bottom like a jeans back pocket -->
  <path fill="#F4B63F" d="M29 45h50v19.5a4 4 0 0 1-2.3 3.6L55.7 78.2a4 4 0 0 1-3.4 0L31.3 68.1A4 4 0 0 1 29 64.5z"/>
</svg>
